<style>

  table.ppl tr.tot{background:#f3f8fa;border-radius:8px;padding:10px 8px;border-bottom:none}
  /* 項目與價錢：一個項目一塊（名稱＋價錢／PF 與適用起／按鈕） */

}

<script>
'use strict';
// ============================================================
// 管理頁：讀試算表的門診＋病房兩個分頁，每月統計件數、金額（件數×價錢）、PF（價錢×PF 比例），
// 依開單醫師、來源、項目分開看。項目與價錢在試算表「項目」分頁改（某個月起調價：加一列、填適用起）。
// 開著時每分鐘讀一次試算表。
// ============================================================
const LS_CACHE='pedsSelfpay_admin';
const SID=getSheetId();
let D=null, checked=0, busy=false, fail=null, delta=null;
let cur=null, pickOpen=false, pickYear=null, _mbKeys=[];
const ui={};          // 卡片展開狀態只記在這次開啟（每次打開都收起來）
let showVoid=false, _calc={}, _months=new Set();
// 在管理頁修改「項目」「醫師」：透過 Apps Script 網頁應用程式（網址＝修改權限，存在這台裝置或連結的 #w=…，不寫進試算表）
const ADMIN_URL='https://leo005741010-byte.github.io/peds-selfpay/admin.html', LS_WRITE='pedsSelfpay_w';
const writeIdOf=v=>{ const m=String(v||'').match(/[#&]w=([A-Za-z0-9_-]{30,})/)||String(v||'').match(/script\.google\.com\/macros\/s\/([A-Za-z0-9_-]{30,})\/(?:exec|dev)/); return m?m[1]:null; };
let WID=(()=>{ const h=writeIdOf(location.hash); if(h){ try{ localStorage.setItem(LS_WRITE,h); }catch(e){} return h; } try{ return localStorage.getItem(LS_WRITE)||null; }catch(e){ return null; } })();
let edit=null, saving=false, wSetup=false, docNew='', _deferred=false;   // edit＝正在填的項目表單 {mode:'add'|'price'|'edit', old, name, price, pf, from, dirty}
const busyKeys={};    // 剛按了刪除／復原、還在等試算表出現的：{key:時間}
(function loadCache(){ try{ const c=JSON.parse(localStorage.getItem(LS_CACHE)||'null'); if(c&&c.sid===SID){ D={cfg:c.cfg,recs:c.recs}; checked=c.checked||0; prep(); } }catch(e){} })();
function saveCache(){ try{ localStorage.setItem(LS_CACHE,JSON.stringify({sid:SID,cfg:D.cfg,recs:D.recs,checked})); }catch(e){} }

// ---------- 計算 ----------
// 每一筆的金額＝那個月適用的價錢；PF＝價錢×PF 比例（四捨五入到元）
function prep(){
  _calc={}; _months=new Set();
  D.recs.forEach(r=>{ const p=priceOf(D.cfg,r.item,r.k); r.known=!!p; r.amt=p?p.price:0; r.pf=p?Math.round(p.price*p.pf):0; if(!r.void) _months.add(r.k); });
}
const hasMonth=k=>_months.has(k);
function calcMonth(k){
  if(_calc[k]) return _calc[k];
  const z=()=>({n:0,amt:0,pf:0,item:{}}), add=(o,r)=>{ o.n++; o.amt+=r.amt; o.pf+=r.pf; o.item[r.item]=(o.item[r.item]||0)+1; };
  const c={k,rows:[],n:0,amt:0,pf:0,item:{},doc:{},src:{'門診':z(),'病房':z()},noPrice:{},oddDoc:{},noDoc:0,noItem:0,badMrn:0,dups:new Set(),voided:[]}, seen={};
  D.recs.forEach(r=>{
    if(r.k!==k) return;
    if(r.void){ c.voided.push(r); return; }
    c.rows.push(r); c.n++; c.amt+=r.amt; c.pf+=r.pf;
    const it=c.item[r.item]||(c.item[r.item]={n:0,amt:0,pf:0,src:{}}); it.n++; it.amt+=r.amt; it.pf+=r.pf; it.src[r.src]=(it.src[r.src]||0)+1;
    add(c.doc[r.doc]||(c.doc[r.doc]=z()),r); add(c.src[r.src]||(c.src[r.src]=z()),r);
    if(!r.item) c.noItem++; else if(!r.known) c.noPrice[r.item]=(c.noPrice[r.item]||0)+1;
    if(!r.doc) c.noDoc++; else if(D.cfg.docs.length&&!D.cfg.docs.includes(r.doc)) c.oddDoc[r.doc]=(c.oddDoc[r.doc]||0)+1;
    if(!/^\d{3}$/.test(r.mrn)) c.badMrn++;
    const dk=`${r.d}|${r.mrn}|${r.item}`; if(seen[dk]){ c.dups.add(seen[dk]); c.dups.add(r.key); } else seen[dk]=r.key;   // 同一天、同病歷號末3碼、同項目
  });
  return _calc[k]=c;
}
// 項目照「項目」分頁的順序；分頁上沒有的排最後
function itemOrder(obj){ const names=itemNames(D.cfg); return names.filter(n=>obj[n]).concat(Object.keys(obj).filter(n=>!names.includes(n))); }
function docOrder(obj){ const ds=D.cfg.docs; return ds.filter(n=>obj[n]).concat(Object.keys(obj).filter(n=>!ds.includes(n)).sort((a,b)=>(a==='')-(b==='')||a.localeCompare(b,'zh-Hant'))); }
// 月份：有紀錄的月份＋這個月
const allKeys=()=>[...new Set([..._months,todayKey()])].sort();
// 折線圖的月份：從第一個有紀錄的月份連續到這個月（中間沒紀錄的月份是 0）
function trendKeys(){ const ks=allKeys(); if(!ks.length) return []; const out=[]; for(let k=ks[0];k<=ks[ks.length-1];k=shiftKey(k,1)) out.push(k); return out; }

// ---------- 顏色 ----------
const ICOLOR=['#1f6f8b','#e07b39','#2e9e6b','#8e6bb5','#5b9bd5','#c9a34a','#d16a8a','#4fb3bf'];
const PCOLOR=['#1a4a7a','#e2574c','#2e9e6b','#c9a34a','#8e6bb5','#4fb3bf','#d16a8a','#6b8e23'];
const SCOLOR={'門診':'#1f6f8b','病房':'#e07b39'};
const hashI=s=>[...String(s)].reduce((t,ch)=>t+ch.charCodeAt(0),0);
function itemColor(n){ const i=itemNames(D.cfg).indexOf(n); return i<0?'#9aa7b4':ICOLOR[i%ICOLOR.length]; }
function docColor(n){ if(!n) return '#b8c2cc'; let i=D.cfg.docs.indexOf(n); if(i<0) i=D.cfg.docs.length+hashI(n); return PCOLOR[i%PCOLOR.length]; }

// ---------- 讀試算表 ----------
async function refresh(silent){
  if(!SID||busy) return;
  busy=true; renderStatus();
  try{
    const r=await loadSheet(SID,['門診','病房']);
    const before=D?D.recs.filter(x=>!x.void):[], cnt={}; before.forEach(x=>cnt[x.k]=(cnt[x.k]||0)+1);
    const sigOld=D?JSON.stringify([D.cfg,D.recs]):'';
    D={cfg:r.cfg,recs:r.recs}; prep(); checked=Date.now(); fail=null; saveCache();
    const changed=JSON.stringify([D.cfg,D.recs])!==sigOld;
    if(before.length||sigOld){ const now={}; D.recs.filter(x=>!x.void).forEach(x=>now[x.k]=(now[x.k]||0)+1);
      const dl=[...new Set([...Object.keys(cnt),...Object.keys(now)])].sort().map(k=>{ const d=(now[k]||0)-(cnt[k]||0); return d?`${Number(k.split('-')[1])}月 ${d>0?'+':''}${d} 件`:''; }).filter(Boolean).join('、');
      if(dl) delta={txt:dl,at:Date.now()}; }
    Object.keys(busyKeys).forEach(k=>{ const x=D.recs.find(y=>y.key===k); if(!x||x.void===busyKeys[k].v||Date.now()-busyKeys[k].at>60000) delete busyKeys[k]; });
    busy=false;
    if((changed||!silent||_deferred)&&!holdRender()) renderAll(); else { if(changed) _deferred=true; renderStatus(); renderAlerts(); }
  }catch(e){
    busy=false; fail={at:Date.now(),msg:(e&&e.message)||String(e)};
    renderStatus(); renderAlerts(); if(!D) renderAll();
    if(!silent) alert('讀取試算表失敗：'+fail.msg+(D?'\n\n畫面上是上次讀到的資料。':''));
  }
}

// ---------- 畫面 ----------
function renderStatus(){
  $('btn-refresh').disabled=busy||!SID;
  $('status').textContent=busy?'讀取試算表中…':fail?`⚠ ${hm(fail.at)} 讀取失敗`+(checked?`，顯示 ${hm(checked)} 的資料`:''):
    checked?`試算表已同步 ${hm(checked)}`+(delta&&Date.now()-delta.at<10*60*1000?`　新進：${delta.txt}`:''):'';
}
function renderAlerts(){
  const a=[];
  if(fail&&D) a.push(`<div class="note bad">讀不到試算表：${esc(fail.msg)}（畫面上是 ${hm(checked)} 的資料）</div>`);
  $('alerts').innerHTML=a.join('');
}
function renderAll(){
  _deferred=false; renderAlerts(); renderStatus();
  if(!SID||!D){ renderSetup(); renderMonthBar([]); return; }
  const ks=allKeys(); if(!cur||!ks.includes(cur)) cur=ks.includes(todayKey())?todayKey():ks[ks.length-1];
  renderMonth(); renderMonthBar(ks);
}
function renderSetup(){
  $('month-view').innerHTML=!SID?`<div class="card"><h2>請用連結打開</h2>
    <div class="row"><input type="text" id="link" placeholder="貼上連結" autocomplete="off" style="flex:1;min-width:200px"><button class="btn" data-act="link">開啟</button></div></div>`:
    `<div class="card empty">${fail?'讀不到試算表：'+esc(fail.msg):'讀取試算表中…'}</div>`;
}
function renderMonthBar(ks){
  const bar=$('monthbar'), pk=$('mpick'); _mbKeys=ks;
  if(!ks.length||!cur){ bar.style.display='none'; pk.classList.remove('on'); pickOpen=false; return; }
  bar.style.display='';
  const i=ks.indexOf(cur);
  bar.innerHTML=`<button class="mb-nav" data-act="mstep" data-d="-1" aria-label="上個月"${i>0?'':' disabled'}>‹</button>
    <button class="mb-cur" data-act="mpick"><span>📅</span>${keyLabel(cur)}</button>
    <button class="mb-nav" data-act="mstep" data-d="1" aria-label="下個月"${i<ks.length-1?'':' disabled'}>›</button>`;
  if(!pickOpen){ pk.classList.remove('on'); return; }
  const years=[...new Set(ks.map(k=>+k.split('-')[0]))];
  if(pickYear==null||!years.includes(pickYear)) pickYear=+cur.split('-')[0];
  const yi=years.indexOf(pickYear), now=todayKey();
  pk.innerHTML=`<div class="box"><div class="yr"><button class="mb-nav" data-act="myear" data-d="-1"${yi>0?'':' disabled'}>‹</button><b>${pickYear}年</b><button class="mb-nav" data-act="myear" data-d="1"${yi<years.length-1?'':' disabled'}>›</button></div>
    <div class="grid">${[...Array(12)].map((_,j)=>{ const k=`${pickYear}-${pad(j+1)}`, has=ks.includes(k);
      return `<button class="m${k===cur?' on':''}${k===now?' now':''}" ${has?`data-act="month" data-k="${k}"`:'disabled'}>${j+1}月</button>`; }).join('')}</div></div>`;
  pk.classList.add('on');
}
function switchMonth(k){ if(!k||k===cur){ pickOpen=false; renderAll(); return; } cur=k; pickOpen=false; renderAll(); window.scrollTo({top:0}); }

function monthWarnings(c){
  const w=[];
  const np=Object.keys(c.noPrice); if(np.length) w.push(`項目「${np.join('、')}」在試算表「項目」分頁找不到（${sumVals(c.noPrice)} 件以 0 元計），請到「項目」分頁加上，或確認是不是打錯字。`);
  const od=Object.keys(c.oddDoc); if(od.length) w.push(`醫師「${od.join('、')}」不在試算表「醫師」分頁的名單上（${sumVals(c.oddDoc)} 件），請確認是不是打錯字。`);
  if(c.noDoc) w.push(`有 ${c.noDoc} 筆沒填開單醫師。`);
  if(c.noItem) w.push(`有 ${c.noItem} 筆沒填項目。`);
  if(c.badMrn) w.push(`有 ${c.badMrn} 筆的病歷號末3碼不是 3 位數字。`);
  if(c.dups.size) w.push(`有 ${c.dups.size} 筆可能重複登錄（同一天、同病歷號末3碼、同項目），在「明細」標 ⚠。`);
  return w;
}
const unitOf=m=>m==='n'?'件':'元';

function recRow(r,c){
  const b=busyKeys[r.key];
  return `<div class="rec${r.void?' void':''}"><span class="dd">${r.md}</span><span class="src ${r.src==='門診'?'o':'w'}">${r.src}</span><span class="m">${esc(r.mrn)}</span>`+
    `<span class="i">${esc(r.item)}${c&&c.dups.has(r.key)?' <b class="dupw" title="同一天、同病歷號末3碼、同項目有兩筆以上">⚠ 重複？</b>':''}</span><span class="dc">${esc(r.doc)||'<span style="color:var(--bad)">未填</span>'}</span><span class="a">${fmt(r.amt)}</span>`+
    (b?'<span class="mut">處理中…</span>':r.void?`<button class="btn mini outline" data-act="restore" data-k="${esc(r.key)}">復原</button>`:`<button class="btn mini ghost" data-act="del" data-k="${esc(r.key)}">刪除</button>`)+'</div>';
}
function yearHtml(){
  const y=cur.split('-')[0], ks=trendKeys().filter(k=>k.startsWith(y+'-'));
  if(!ks.length) return '<div class="mut">還沒有資料</div>';
  const t={n:0,amt:0,pf:0,o:0,w:0};
  const rows=ks.map(k=>{ const c=calcMonth(k); t.n+=c.n; t.amt+=c.amt; t.pf+=c.pf; t.o+=c.src['門診'].n; t.w+=c.src['病房'].n;
    return `<tr class="clk${k===cur?' cur':''}" data-act="month" data-k="${k}"><td class="l">${Number(k.split('-')[1])}月</td><td class="n">${c.n}</td><td class="n">${c.src['門診'].n}</td><td class="n">${c.src['病房'].n}</td><td class="n">${fmt(c.amt)}</td><td class="amt">${fmt(c.pf)}</td></tr>`; }).join('');

function edSave(){

// ---------- 趨勢（點數字磚跳出折線圖）----------
// val＝每一筆算多少；who＝視窗最上面「這個數字各人占多少」怎麼拆
const TREND={
  amt: {title:'總金額',   unit:'元',val:r=>r.amt,who:'docAmt',daily:1},
  n:   {title:'總件數',   unit:'件',val:()=>1,who:'item',daily:1},
  pf:  {title:'PF 合計',  unit:'元',val:r=>r.pf,who:'docPf'},
  opd: {title:'門診金額', unit:'元',val:r=>r.src==='門診'?r.amt:0,who:'docAmt',src:'門診'},
  ward:{title:'病房金額', unit:'元',val:r=>r.src==='病房'?r.amt:0,who:'docAmt',src:'病房'},
};
function trendDef(m){
  if(TREND[m]) return TREND[m];
  if(/^d:/.test(m)){ const n=m.slice(2); return {title:`${n||'（未填醫師）'}・PF`,unit:'元',val:r=>r.doc===n?r.pf:0}; }
  return null;
}
const monthVal=(m,k)=>{ const T=trendDef(m); return calcMonth(k).rows.reduce((t,r)=>t+T.val(r),0); };
const pctVs=(v,pv)=>pv?(v-pv)/Math.abs(pv)*100:null;
const pctHtml=d=>`<span class="${d>=0?'up':'dn'}">${d>=0?'▲ +':'▼ '}${d.toFixed(1)}%</span>`;
// 某個月每天各加了多少：當月算到今天，其他月份算到月底；日期在今天之後的不算（late）
function dailySums(k,val){
  const [yy,mm]=k.split('-').map(Number), isNow=k===todayKey(), DD=isNow?new Date().getDate():new Date(yy+1911,mm,0).getDate(), sum=new Array(DD+1).fill(0); let late=0;
  calcMonth(k).rows.forEach(r=>{ if(r.d>DD){ late++; return; } sum[Math.max(1,r.d)]+=val(r); });
  return {sum,D:DD,mm,isNow,late};
}
const mtd=(m,k,d)=>{ const s=dailySums(k,trendDef(m).val); let t=0; for(let i=1;i<=Math.min(d,s.D);i++) t+=s.sum[i]; return t; };
const firstKey=()=>{ const ks=[..._months].sort(); return ks[0]||todayKey(); };
// 這個月還沒過完：比「上月同期」（上個月 1 日到同一天）。回傳 {pv}；不是當月回 null
function prevSamePeriod(m,key){
  if(key!==todayKey()) return null;
  const pk=shiftKey(key,-1); if(pk<firstKey()) return {pv:null};
  return {pv:mtd(m,pk,new Date().getDate())};
}
function vsPrevHtml(m,key){
  const sp=prevSamePeriod(m,key);
  if(sp){ const d=sp.pv==null?null:pctVs(monthVal(m,key),sp.pv); return d==null?'沒有上個月同期的資料可比':'較上月同期 '+pctHtml(d); }
  const pk=shiftKey(key,-1), d=pk<firstKey()?null:pctVs(monthVal(m,key),monthVal(m,pk));
  return d==null?'沒有上個月的資料可比':'較上月 '+pctHtml(d);
}
// 預估全月＝目前累計 ÷ 已過天數 × 這個月的天數（過了 3 天才估；數字不寫到個位數）
function projHtml(m,key){
  if(key!==todayKey()) return '';
  const [y,mo]=key.split('-').map(Number), dim=new Date(y+1911,mo,0).getDate(), DD=new Date().getDate();
  if(DD>=dim||DD<3) return '';
  const proj=monthVal(m,key)*dim/DD, pk=shiftKey(key,-1), d=pk<firstKey()?null:pctVs(proj,monthVal(m,pk));
  const shown=proj>=10000?Math.round(proj/1000)*1000:proj>=100?Math.round(proj/10)*10:Math.round(proj);
  return `預估全月約 ${fmt(shown)}${d==null?'':'，較上月 '+pctHtml(d)}`;
}
// 折線圖（純 SVG）。pts=[{k:'115-10',v}]，curKey 那一點用橘色；day＝月份數字時是逐日模式（k 是幾日）
function lineSvg(pts,curKey,day){
  const n=pts.length, nice=m=>{ const raw=m/4, e=Math.pow(10,Math.floor(Math.log10(raw)));   // 縱軸分四格，每格取剛好夠大的整齊整數（最大 10,197 → 上限 12,000）
    return 4*([1,1.25,1.5,2,2.5,3,4,5,6,8,10].map(f=>f*e).find(v=>v>=raw&&Math.abs(v-Math.round(v))<1e-9)||Math.ceil(raw)); };
  const all=pts.map(p=>p.v), max=Math.max(0,...all), min=Math.min(0,...all);
  const lo=min<0?-nice(-min):0, hi=max>0?nice(max):(lo<0?0:4);
  const W=400,H=230,L=lo<0?60:56,R=22,B=38, step=n>1?(W-L-R)/(n-1):W, T=n>6?40:26;
  const x=i=>n===1?L+(W-L-R)/2:L+step*i, y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';
  for(let i=0;i<=4;i++){ const v=lo+(hi-lo)*i/4, yy=y(v);
    g+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="${v===0&&lo<0?'#9aa7b8':'#dce7ec'}" stroke-width="1"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="10.5" fill="#6b7a8c">${fmt(v)}</text>`; }
  for(let i=1;i<n;i++) g+=`<line x1="${x(i-1)}" y1="${y(pts[i-1].v)}" x2="${x(i)}" y2="${y(pts[i].v)}" stroke="#1f6f8b" stroke-width="2.5" stroke-linecap="round"/>`;
  const boxes=[], labelY=(x0,cy,w)=>{   // 點上的數字：會蓋到前面的數字時改放更高或點的下方
    for(const dy of [-10,-23,21,-36,34]){ const ty=cy+dy, b=[x0-2,ty-10,x0+w+2,ty+3];
      if(ty<11||ty>H-B-3||boxes.some(o=>b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1])) continue;
      boxes.push(b); return ty; }
    return cy-10; };
  let lastY=null;
  pts.forEach((p,i)=>{ const [yy,mm]=day?[0,0]:p.k.split('-').map(Number), on=p.k===curKey, show=n<=(day?8:12)||on||i===n-1||!!p.lab;
    const tick=day?(n<=16||i===0||i===n-1||((i+1)%5===0&&n-1-i>1)?p.k:''):mm+'月';
    const anc=n>1&&i===0?'start':n>1&&i===n-1?'end':'middle', lx=x(i)+(anc==='start'?4:anc==='end'?-4:0), lw=fmt(p.v).length*6.4;
    const ly=show?labelY(anc==='start'?lx:anc==='end'?lx-lw:lx-lw/2,y(p.v),lw):0;
    g+=(day&&n>16&&!on&&i!==n-1&&!p.lab?'':`<circle cx="${x(i)}" cy="${y(p.v)}" r="${on?5.5:4}" fill="${on?'#f2a541':'#1f6f8b'}" stroke="#fff" stroke-width="1.5"/>`)+
      (show?`<text x="${lx}" y="${ly}" text-anchor="${anc}" font-size="11" font-weight="700" fill="${on?'#a85800':'#16536a'}" stroke="#fff" stroke-width="3" paint-order="stroke">${fmt(p.v)}</text>`:'')+
      (tick!==''?`<text x="${x(i)}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="#1f2d3d">${tick}</text>`:'')+
      (day?(i===0?`<text x="${x(i)}" y="${H-B+30}" text-anchor="middle" font-size="10" fill="#6b7a8c">${day}月</text>`:''):
       yy!==lastY?`<text x="${x(i)}" y="${H-B+30}" text-anchor="middle" font-size="10" fill="#6b7a8c">${yy}年</text>`:'');
    lastY=yy; });
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
// 逐日累進（＋總金額／總件數另有「逐日，不累計」）：跟著目前看的月份走
function cumHtml(m){
  const T=trendDef(m), s=dailySums(cur,T.val), pts=[]; let a=0;
  for(let d=1;d<=s.D;d++){ a+=s.sum[d]; pts.push({k:d,v:a}); }
  let h=`<div class="cumh">${keyLabel(cur)}・逐日累進<small>${s.mm}月1日～${s.D}日</small></div>${lineSvg(pts,s.isNow?s.D:-1,s.mm)}`;
  if(s.late) h+=`<div class="sub2" style="margin-top:0">有 ${s.late} 筆的日期在今天之後，沒有畫進來。</div>`;
  if(T.daily){ const dp=[]; let mx=1; for(let d=1;d<=s.D;d++){ dp.push({k:d,v:s.sum[d]}); if(s.sum[d]>s.sum[mx]) mx=d; }
    if(s.sum[mx]>0) dp[mx-1].lab=1;
    h+=`<div class="cumh">${keyLabel(cur)}・逐日<small>每天各增加多少（不累計）</small></div>${lineSvg(dp,s.isNow?s.D:-1,s.mm)}`; }

}
function monthTable(m){

async function doVoid(key,restore){
  const r=D&&D.recs.find(x=>x.key===key); if(!r) return;
  if(!sysReady(D.cfg.sys)){ alert('試算表的「系統」分頁不完整，無法刪除。可以直接到試算表刪掉那一列。'); return; }
  if(!confirm(`${restore?'復原':'刪除'}這一筆？\n\n${r.m}月${r.d}日・${r.src}・病歷號末3碼 ${r.mrn}\n${r.item}\n開單醫師：${r.doc||'未填'}`)) return;
  busyKeys[key]={v:!restore,at:Date.now()}; rerenderOpen();
  try{ await voidRec(D.cfg.sys,key,restore); }catch(e){ delete busyKeys[key]; rerenderOpen(); alert('送不出去（沒有網路？），請稍後再試。'); return; }
  for(const ms of [3000,6000,10000,20000]){ await new Promise(res=>setTimeout(res,ms)); await refresh(true); if(!busyKeys[key]) break; }
  delete busyKeys[key]; rerenderOpen();
}
async function saveWrite(){
  const id=writeIdOf(($('w-url')||{}).value);
  if(!id){ alert('這看起來不是網頁應用程式的網址（應該長得像 https://script.google.com/macros/s/…/exec）。'); return; }
  if(!window.PS_MOCK){
    let ok=false; try{ const r=await fetch(`https://script.google.com/macros/s/${id}/exec`); ok=(await r.text()).trim()==='ok'; }catch(e){}
    if(!ok){ alert('連不上這個網址。\n請確認部署時「執行身分」選「我」、「誰可以存取」選「所有人」，而且程式碼是新版（有 doPost）。'); return; }
  }
  if(!confirm('在這台裝置開啟「項目與價錢」的修改？')) return;
  WID=id; wSetup=false; try{ localStorage.setItem(LS_WRITE,id); }catch(e){}
  history.replaceState(null,'',location.pathname+location.search+`#s=${SID}&w=${id}`);   // iPhone「加入主畫面」會存下含修改權限的完整網址
  renderAll();
}
// 視窗開著時連視窗一起重畫（目前開的是哪一種記在 _dlg）
let _dlg=null;
function rerenderOpen(){ renderAll(); if($('mask').classList.contains('on')&&_dlg) _dlg(); }

// ---------- 操作 ----------
function act(a,t){
  const k=t.dataset.k;
  if(a==='refresh') refresh(false);
  else if(a==='month') switchMonth(k);
  else if(a==='mstep') switchMonth(_mbKeys[_mbKeys.indexOf(cur)+Number(t.dataset.d)]);
  else if(a==='mpick'){ pickOpen=!pickOpen; pickYear=null; renderMonthBar(_mbKeys); }
  else if(a==='myear'){ const ys=[...new Set(_mbKeys.map(x=>+x.split('-')[0]))], y=ys[ys.indexOf(pickYear)+Number(t.dataset.d)]; if(y){ pickYear=y; renderMonthBar(_mbKeys); } }
  else if(a==='trend'){ const m=t.dataset.m; _dlg=()=>showTrend(m); _dlg(); }
  else if(a==='doc'){ _dlg=()=>showDoc(k); _dlg(); }
  else if(a==='src'){ _dlg=()=>showSrc(k); _dlg(); }
  else if(a==='today'){ _dlg=showToday; _dlg(); }
  else if(a==='close'){ $('mask').classList.remove('on'); _dlg=null; }
  else if(a==='del') doVoid(k,false);
  else if(a==='restore') doVoid(k,true);
  else if(a==='showvoid'){ showVoid=!showVoid; renderAll(); }
  else if(a==='ed-add'){ edit={mode:'add',name:'',price:'',pf:'10',from:''}; ui.cfg=true; renderAll(); const x=document.querySelector('[data-ed=name]'); if(x) x.focus(); }
  else if(a==='ed-price'||a==='ed-edit'){ const x=D.cfg.items.find(y=>y.order===Number(t.dataset.i)); if(!x) return;
    edit=a==='ed-price'?{mode:'price',name:x.name,price:'',pf:String(Math.round(x.pf*1000)/10),from:monthIn(shiftKey(todayKey(),1))}:
      {mode:'edit',old:{name:x.name,price:x.price,from:x.from},name:x.name,price:String(x.price),pf:String(Math.round(x.pf*1000)/10),from:monthIn(x.from)};
    renderAll(); const f=document.querySelector('[data-ed=price]'); if(f) f.focus(); }
  else if(a==='ed-cancel'){ if(edit&&edit.dirty&&!confirm('放棄還沒儲存的內容？')) return; edit=null; renderAll(); }
  else if(a==='ed-save') edSave();
  else if(a==='ed-off'){ const n=t.dataset.n, off=t.dataset.v==='1';
    if(!confirm(off?`停用「${n}」？\n\n門診表單和病房 App 不會再出現這個選項；以前的紀錄照算。`:`恢復「${n}」？\n\n門診表單和病房 App 會再出現這個選項。`)) return;
    saveAdmin({op:'offItem',name:n,off}); }
  else if(a==='doc-add'){ const n=String(($('doc-new')||{}).value||'').replace(/\s+/g,''); if(!n){ alert('請填醫師姓名。'); return; }
    if((D.cfg.docsOn||D.cfg.docs).some(x=>canon(x)===canon(n))){ alert(`「${n}」已經在名單上了。`); return; }
    if(!confirm(`新增開單醫師「${n}」？\n\n門診表單和病房 App 會出現這個名字。`)) return;
    saveAdmin({op:'addDoc',name:n}).then(ok=>{ if(ok){ docNew=''; renderAll(); } }); }
  else if(a==='doc-off'){ const n=t.dataset.n, off=t.dataset.v==='1';
    if(!confirm(off?`停用「${n}」？\n\n門診表單和病房 App 不會再出現這個名字；以前的紀錄照算。`:`恢復「${n}」？`)) return;
    saveAdmin({op:'offDoc',name:n,off}); }
  else if(a==='w-setup'){ wSetup=true; ui.cfg=true; renderAll(); const x=$('w-url'); if(x) x.focus(); }
  else if(a==='w-cancel'){ wSetup=false; renderAll(); }
  else if(a==='w-save') saveWrite();
  else if(a==='w-copy'){
    const url=`${ADMIN_URL}?openExternalBrowser=1#s=${SID}&w=${WID}`, done=()=>{ const o=t.textContent; t.textContent='✓ 已複製'; setTimeout(()=>{ t.textContent=o; },1500); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,()=>prompt('請複製這條連結：',url)); else prompt('請複製這條連結：',url);
  }
  else if(a==='link'){
    const id=sheetIdOf(($('link')||{}).value);
    if(!id){ alert('這看起來不是正確的連結，請把收到的整條連結完整貼上。'); return; }
    try{ localStorage.setItem(LS_SHEET,id); }catch(e){}
    location.hash='s='+id; location.reload();
  }
}
document.addEventListener('click',e=>{
  if(e.target===$('mask')){ $('mask').classList.remove('on'); _dlg=null; return; }
  if(pickOpen&&!e.target.closest('#mpick')&&!e.target.closest('#monthbar')){ pickOpen=false; $('mpick').classList.remove('on'); }
  const t=e.target.closest('[data-act]'); if(!t||t.tagName==='INPUT') return;
  act(t.dataset.act,t);
});
document.addEventListener('toggle',e=>{ const d=e.target; if(d.dataset&&d.dataset.sec) ui[d.dataset.sec]=d.open; },true);
document.addEventListener('input',e=>{ const t=e.target; if(edit&&t.dataset&&t.dataset.ed){ edit[t.dataset.ed]=t.value; edit.dirty=true; } if(t.id==='doc-new') docNew=t.value; });
// 填到一半離開前提醒
window.addEventListener('beforeunload',e=>{ if(edit&&edit.dirty){ e.preventDefault(); e.returnValue=''; } });

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ $('mask').classList.remove('on'); _dlg=null; } if(e.key==='Enter'&&e.target.id==='link') act('link',e.target);
  if(e.key==='Enter'&&e.target.id==='doc-new') act('doc-add',e.target); if(e.key==='Enter'&&e.target.id==='w-url') saveWrite(); if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.ed) edSave(); });
window.addEventListener('hashchange',()=>{ const id=sheetIdOf(location.hash), w=writeIdOf(location.hash); if((id&&id!==SID)||(w&&w!==WID)) location.reload(); });
// 開著時每分鐘讀一次；切回來超過 15 秒沒讀過就補讀
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  checkVersion(()=>$('mask').classList.contains('on')||Object.keys(busyKeys).length>0);
  if(Date.now()-checked>15000) refresh(true);
});
setInterval(()=>{ if(document.visibilityState==='visible') refresh(true); },60*1000);
setInterval(()=>{ if(document.visibilityState==='visible') checkVersion(()=>$('mask').classList.contains('on')||Object.keys(busyKeys).length>0); },10*60*1000);

renderAll();
refresh(true);
</script>
