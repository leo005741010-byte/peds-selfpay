<script>/* iPhone 防放大（全 App 統一，主任 2026-10-17）：iPhone／iPad 點輸入框不自動放大，兩指放大照常；Android 不加 maximum-scale（會連兩指放大都鎖掉） */
(function(){var m=document.querySelector('meta[name=viewport]');if(m&&(/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))&&m.content.indexOf('maximum-scale')<0)m.content+=',maximum-scale=1';})();</script>

<script>
// iPhone 的主畫面 App 有自己獨立的儲存空間：帶 #s=… 的連結在 iPhone 上不掛 manifest，
// 「加入主畫面」存下來的才會是含 # 的完整網址（掛了 manifest 時 iOS 只存 start_url，打開會變成要重新貼連結）。
(function(){
  var ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&/[#&]s=/.test(location.hash)) return;
  document.write('<link rel="manifest" href="manifest.json">');
})();
</script>

<script>
// PWA：只在正式網站註冊 Service Worker（本機測試不註冊，免得測到快取的舊版）
if('serviceWorker' in navigator && location.protocol==='https:'){
  const had=!!navigator.serviceWorker.controller; let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!had||reloading) return; reloading=true; location.reload(); });
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}); });
}
</script>
<style>
:root{--navy:#1f6f8b;--navy-dark:#16536a;--bg:#eef4f6;--card:#fff;--line:#dce7ec;--txt:#1f2d3d;--mut:#6b7a8c;
  --ok:#1f8a4c;--okbg:#e6f5ec;--warn:#a85800;--warnbg:#fff4e0;--bad:#c0392b;--badbg:#fdecea}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
/* 頁首固定在上面；iPhone 加到主畫面時讓出瀏海的位置 */
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 1px 6px rgba(0,0,0,.15)}
header.top .wrap{display:flex;align-items:center;justify-content:center;height:50px}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:1px}
main.wrap{padding-top:12px;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.card,.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(18,53,90,.05)}
.sl{font-size:13.5px;font-weight:700;color:var(--navy-dark);margin:0 0 8px}
.sl.err{color:var(--bad)}
/* 一排三格的選項（日期、來院、開單醫師） */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sg{position:relative;font:inherit;font-size:16px;border:1.5px solid #c9d6dd;background:#fff;color:var(--txt);border-radius:11px;padding:7px 4px;min-height:48px;cursor:pointer;
  text-align:center;line-height:1.25;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sg small{font-size:12px;color:var(--mut);margin-top:1px}
.sg.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.sg.on small{color:rgba(255,255,255,.85)}
/* 「其他日期」：日期框透明蓋在格子上，點下去叫出手機的日期選單（不會撐出畫面） */
.sg input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;margin:0;padding:0;font-size:16px;-webkit-appearance:none;appearance:none;cursor:pointer}
.err .sg,.err .it{border-color:#e9a39b}
input[type=text]{font:inherit;font-size:18px;display:block;width:100%;min-width:0;border:1.5px solid #c9d6dd;border-radius:11px;padding:10px 12px;background:#fbfdfe;color:var(--txt);-webkit-appearance:none;appearance:none}
input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(31,111,139,.18)}
input.err{border-color:var(--bad);background:var(--badbg)}
#f-mrn{font-size:24px;letter-spacing:2px;font-weight:700;font-variant-numeric:tabular-nums}
#f-srcx,#f-other{margin-top:8px}
/* 項目：一排兩格，名稱下面是價錢 */
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cath{grid-column:1/-1;font-size:12.5px;color:var(--mut);font-weight:700;margin:0 0 -2px}
.cath~.cath{margin-top:6px}
.it{font:inherit;text-align:left;border:1.5px solid #c9d6dd;background:#fff;color:var(--txt);border-radius:12px;padding:9px 11px;min-height:60px;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;gap:2px}
.it b{font-size:15px;font-weight:600;line-height:1.3;word-break:break-word}
.it span{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.it.on{background:var(--navy);border-color:var(--navy);color:#fff}
.it.on b{font-weight:700}.it.on span{color:rgba(255,255,255,.85)}
/* 送出鈕固定在最下面 */
.sendbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(238,244,246,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.sendbar .btn{display:block;width:100%;max-width:532px;margin:0 auto;font-size:18px;font-weight:700;padding:13px;border-radius:13px}
.btn{font:inherit;font-size:14px;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--navy-dark)}
.btn.outline{background:#fff;color:var(--navy)}
.btn.mini{font-size:12.5px;padding:3px 10px;border-radius:6px}
.btn.ghost{background:transparent;color:var(--mut);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.note{border-radius:10px;padding:9px 13px;font-size:14px;margin-bottom:10px}
.note.warn{background:var(--warnbg);color:var(--warn);border:1px solid #f3d9a4}
.note.bad{background:var(--badbg);color:var(--bad);border:1px solid #f1b9b3}
.ps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-radius:11px;margin-bottom:8px;font-size:14.5px;border:1px solid var(--line);background:#fff}
.ps .pt{flex:1;min-width:0}
.ps.ok{background:var(--okbg);border-color:#b9e2c8;color:#145c33}
.ps.miss,.ps.out{background:var(--warnbg);border-color:#f3d9a4;color:#7a4300}
details.sec>summary{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;color:var(--navy-dark);font-size:15.5px;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:'▸';color:var(--mut);font-size:15px;transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec[open]>summary{margin-bottom:8px}
details.sec>summary .r{margin-left:auto;font-weight:400;color:var(--mut);font-size:13.5px}
.dh{font-size:13px;color:var(--mut);font-weight:700;margin:10px 0 2px}
.rec{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.rec .m{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.rec .i{flex:1;min-width:120px}
.rec .dc{color:var(--mut)}
.rec .sb{font-size:11.5px;font-weight:700;border-radius:5px;padding:0 6px;color:#fff;background:#8e6bb5}
.rec .sb.o{background:#1f6f8b}.rec .sb.w{background:#e07b39}
.mut{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.foot{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:12.5px;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.instc .insth{font-weight:700;color:var(--navy-dark);font-size:15.5px;margin-bottom:6px}
.instc .instp{margin-top:8px;font-size:14px}
.instc ol{margin:6px 0 0;padding-left:22px;font-size:14px}
.instc li{margin:3px 0}
.instc .ico{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:12px;margin:0 2px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1>兒科自費登錄</h1></div></header>
<main class="wrap">
  <div id="alerts"></div>
  <div id="pend"></div>
  <div id="form"></div>
  <div id="rest"></div>
  <div class="foot"><span id="status"></span><button class="btn mini ghost" id="btn-refresh" data-act="refresh">🔄 更新</button></div>
</main>
<div class="sendbar" id="sendbar" style="display:none"><button class="btn" data-act="send">送出</button></div>
<script>
if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&/[?&]mock\b/.test(location.search)) document.write('<script src="_mock.js"><\/script>');
</script>
<script src="core.js"></script>
<script>
'use strict';
// ============================================================
// 登錄：填 日期／來院（住院、門診、其他；預設住院）／病歷號／項目（分檢驗、疫苗）／開單醫師 → 送到病房表單（寫進試算表「病房」分頁）。
// 送出後回頭讀試算表，看到那一筆才算記錄成功；沒網路時先存在這台手機，連上後自動補送。
// ============================================================
const LS_CACHE='pedsSelfpay_np', LS_OUT='pedsSelfpay_outbox';
const SID=getSheetId();
let data=null, checked=0, busy=false, fail=null;
let draft=null, errs={};
let pending=[];   // 這次開啟送出的：{id,kind:'add'|'void',date,mrn,item,doc,key,at,st:'sending'|'check'|'ok'|'miss'|'out'}
const ui={};      // 卡片展開狀態只記在這次開啟（每次打開都收起來）
function newDraft(){ return {date:isoDay(new Date()),src:'住院',srcX:'',mrn:'',item:'',doc:'',other:false,otherName:''}; }
const canSend=()=>!!data&&sysReady(data.cfg.sys)&&!!data.cfg.sys.eSrc;   // 試算表要有「來院」欄才能送
draft=newDraft();
(function loadCache(){
  try{ const c=JSON.parse(localStorage.getItem(LS_CACHE)||'null'); if(c&&c.sid===SID){ data={cfg:c.cfg,recs:c.recs}; checked=c.checked||0; } }catch(e){}
  try{ (JSON.parse(localStorage.getItem(LS_OUT)||'[]')||[]).forEach(p=>{ if(p&&p.sid===SID){ p.st='out'; pending.push(p); } }); }catch(e){}
})();
function saveCache(){ try{ localStorage.setItem(LS_CACHE,JSON.stringify({sid:SID,cfg:data.cfg,recs:data.recs,checked})); }catch(e){} }
function saveOutbox(){ try{ localStorage.setItem(LS_OUT,JSON.stringify(pending.filter(p=>p.st==='out').map(p=>Object.assign({sid:SID},p)))); }catch(e){} }

// ---------- 讀試算表 ----------
async function refresh(silent){
  if(!SID||busy) return;
  busy=true; renderStatus();
  try{
    const r=await loadSheet(SID,['病房']);
    const sig=JSON.stringify([activeItems(r.cfg),r.cfg.docsOn]), old=data?JSON.stringify([activeItems(data.cfg),data.cfg.docsOn]):'';
    data={cfg:r.cfg,recs:r.recs}; checked=Date.now(); fail=null; saveCache();
    matchPending();
    busy=false;
    // 正在打字時不重畫表單（會打斷輸入）；項目／醫師名單有變才重畫
    if(sig!==old&&!typing()) renderForm();
    renderRest(); renderStatus(); renderAlerts();
    flushOutbox();
  }catch(e){
    busy=false; fail={at:Date.now(),msg:(e&&e.message)||String(e)};
    renderStatus(); renderAlerts(); if(!data) renderForm();
    if(!silent) alert('讀取試算表失敗：'+fail.msg);
  }
}
const typing=()=>{ const a=document.activeElement; return !!(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)); };

// 送出／刪除後回頭找試算表裡有沒有那一筆
function matchPending(){
  if(!data) return;
  const used=new Set(pending.filter(p=>p.st==='ok'&&p.hit).map(p=>p.hit));
  pending.forEach(p=>{
    if(p.st!=='check'&&p.st!=='miss') return;
    if(p.kind==='void'){ const r=data.recs.find(x=>x.key===p.key); if(r&&r.void===!p.restore) p.st='ok'; return; }
    const [y,m,d]=p.date.split('-').map(Number);
    const r=data.recs.find(x=>!used.has(x.key)&&!x.void&&mrnCmp(x.mrn)===mrnCmp(p.mrn)&&x.item===p.item&&x.doc===p.doc&&x.y===y&&x.m===m&&x.d===d&&x.ts>=p.at-15*60*1000);
    if(r){ p.st='ok'; p.hit=r.key; used.add(r.key); }
  });
}
let _vTimer=null, _vStep=0;
const V_STEPS=[3000,5000,7000,10000,15000];   // 送出後 3、8、15、25、40 秒各讀一次
function verifySoon(){ clearTimeout(_vTimer); _vStep=0; tick(); function tick(){
  _vTimer=setTimeout(async()=>{ await refresh(true); _vStep++;
    if(pending.some(p=>p.st==='check')){ if(_vStep<V_STEPS.length) tick(); else { pending.forEach(p=>{ if(p.st==='check') p.st='miss'; }); renderRest(); } }
  },V_STEPS[_vStep]); } }
async function sendOne(p){
  try{ p.kind==='void'?await voidRec(data.cfg.sys,p.key,p.restore):await submitRec(data.cfg.sys,p); p.st='check'; }
  catch(e){ p.st='out'; }
  saveOutbox();
}
let _flushing=false;
async function flushOutbox(){
  if(_flushing||!data||!sysReady(data.cfg.sys)||navigator.onLine===false) return;
  const outs=pending.filter(p=>p.st==='out'); if(!outs.length) return;
  _flushing=true; for(const p of outs) await sendOne(p); _flushing=false;
  renderRest(); if(pending.some(p=>p.st==='check')) verifySoon();
}

// ---------- 畫面 ----------
function renderStatus(){
  $('btn-refresh').disabled=busy||!SID;
  $('status').textContent=busy?'讀取中…':fail?`⚠ ${hm(fail.at)} 讀取失敗`+(checked?`，顯示 ${hm(checked)} 的資料`:''):checked?`已同步 ${hm(checked)}`:'';
}
function renderAlerts(){
  const a=[];
  if(fail&&data) a.push(`<div class="note bad">讀不到試算表：${esc(fail.msg)}</div>`);
  if(data&&!canSend()) a.push('<div class="note bad">試算表的「系統」分頁不完整，暫時不能送出。</div>');
  if(navigator.onLine===false) a.push('<div class="note warn">目前沒有網路。</div>');
  $('alerts').innerHTML=a.join('');
}
const WD='日一二三四五六';
const dayStr=v=>{ const [y,m,d]=String(v).split('-').map(Number); return `${m}/${d}（${WD[new Date(y,m-1,d).getDay()]}）`; };
const dayShift=n=>{ const d=new Date(); d.setDate(d.getDate()+n); return isoDay(d); };
function renderForm(){
  const el=$('form'), bar=$('sendbar');
  if(!SID){
    bar.style.display='none';
    el.innerHTML=`<div class="card"><div class="sl">請用連結打開</div>
      <input type="text" id="link" placeholder="貼上連結" autocomplete="off"><div class="row"><button class="btn" data-act="link">開啟</button></div></div>`;
    return;
  }
  if(!data){ bar.style.display='none'; el.innerHTML=`<div class="card empty">${fail?'讀不到試算表：'+esc(fail.msg):'讀取中…'}</div>`; return; }
  const items=activeItems(data.cfg), docs=data.cfg.docsOn||data.cfg.docs, today=isoDay(new Date()), yest=dayShift(-1);
  if(draft.item&&!items.includes(draft.item)) draft.item='';
  const mk=`${+draft.date.slice(0,4)-1911}-${draft.date.slice(5,7)}`;   // 價錢照登錄那一天的月份
  const dSel=draft.date===today?'t':draft.date===yest?'y':'o', E=k=>errs[k]?' err':'';
  el.innerHTML=`<div class="sec${E('date')}"><div class="sl${E('date')}">日期</div><div class="seg">
      <button class="sg${dSel==='t'?' on':''}" data-act="date" data-v="${today}">今天<small>${dayStr(today)}</small></button>
      <button class="sg${dSel==='y'?' on':''}" data-act="date" data-v="${yest}">昨天<small>${dayStr(yest)}</small></button>
      <label class="sg${dSel==='o'?' on':''}">其他日期<small>${dSel==='o'?dayStr(draft.date):'📅 選日期'}</small><input type="date" id="f-date" value="${esc(draft.date)}" max="${today}"></label>
    </div></div>
    <div class="sec${E('src')}"><div class="sl${E('src')}">來院</div><div class="seg">${SRCS.map(x=>`<button class="sg${draft.src===x?' on':''}" data-act="src" data-v="${x}">${x}</button>`).join('')}</div>
      ${draft.src==='其他'?`<input type="text" id="f-srcx" placeholder="哪裡（可不填）" autocomplete="off" value="${esc(draft.srcX)}">`:''}</div>
    <div class="sec"><div class="sl${E('mrn')}">病歷號</div>
      <input type="text" id="f-mrn" inputmode="numeric" autocomplete="off" value="${esc(draft.mrn)}" class="${errs.mrn?'err':''}"></div>
    <div class="sec${E('item')}"><div class="sl${E('item')}">項目</div><div class="items">${catsIn(data.cfg,items).map(cat=>`<div class="cath">${esc(cat)}</div>`+
      items.filter(n=>catOf(data.cfg,n)===cat).map(n=>{ const p=priceOf(data.cfg,n,mk);
        return `<button class="it${draft.item===n?' on':''}" data-act="item" data-v="${esc(n)}"><b>${esc(n)}</b>${p?`<span>${fmt(p.price)} 元</span>`:''}</button>`; }).join('')).join('')}</div></div>
    <div class="sec${E('doc')}"><div class="sl${E('doc')}">開單醫師</div><div class="seg">${docs.map(n=>`<button class="sg${!draft.other&&draft.doc===n?' on':''}" data-act="doc" data-v="${esc(n)}">${esc(n)}</button>`).join('')}<button class="sg${draft.other?' on':''}" data-act="doc-other">其他</button></div>
      ${draft.other?`<input type="text" id="f-other" placeholder="醫師姓名" autocomplete="off" value="${esc(draft.otherName)}" class="${errs.doc?'err':''}">`:''}</div>`;
  bar.style.display=''; bar.querySelector('button').disabled=!canSend();
}
const mdOf=s=>{ const [,m,d]=String(s).split('-').map(Number); return `${m}/${d}`; };
const recTxt=r=>`${r.md||mdOf(r.date)}・${r.src||''}・${mrnDisp(r.mrn,data&&data.cfg.sys)}・${r.item}・${r.doc}`;
function renderRest(){
  const el=$('rest'); if(!SID||!data){ el.innerHTML=''; $('pend').innerHTML=''; return; }
  let h='';
  // 這次送出的狀態（確認成功的 2 分鐘後收起來，在下面「最近登錄」看得到）
  pending=pending.filter(p=>!(p.st==='ok'&&Date.now()-p.at>2*60*1000));
  // 刪掉的若是這次送出的那一筆，那一筆的「已記錄」就不用再顯示
  const gone=new Set(pending.filter(p=>p.kind==='void'&&p.st==='ok').map(p=>p.key));
  pending=pending.filter(p=>!(p.kind==='add'&&p.hit&&gone.has(p.hit)));
  h+=pending.map(p=>{ const v=p.kind==='void', t=esc(v?p.txt:recTxt(p));
    const s=v?{sending:'⏳ 刪除中',check:'⏳ 刪除中',ok:'✓ 已刪除',miss:'⚠ 試算表還沒反映',out:'📴 沒有網路，連上後自動補送'}[p.st]:
      {sending:'⏳ 送出中',check:'⏳ 確認中',ok:'✓ 已記錄',miss:'⚠ 試算表還沒出現這一筆',out:'📴 沒有網路，連上後自動補送'}[p.st];
    return `<div class="ps ${p.st}"><span class="pt"><b>${s}</b>　${t}</span>${p.st==='miss'?`<button class="btn mini outline" data-act="recheck">再查一次</button>`:''}</div>`; }).join('');
  $('pend').innerHTML=h; h='';
  // 最近登錄（這個 App 送出的，最新的在上面）
  const today=new Date(), isT=r=>r.y===today.getFullYear()&&r.m===today.getMonth()+1&&r.d===today.getDate();
  const list=data.recs.filter(r=>!r.void).sort((a,b)=>b.y-a.y||b.m-a.m||b.d-a.d||b.ts-a.ts).slice(0,40);
  let lastD='';
  const rows=list.map(r=>{ const dd=`${r.m}/${r.d}`, head=dd!==lastD?`<div class="dh">${isT(r)?'今天 ':''}${dd}</div>`:''; lastD=dd;
    return head+`<div class="rec"><span class="sb ${srcCls(r.src)}">${esc(r.src)}${r.srcNote?'・'+esc(r.srcNote):''}</span><span class="m">${esc(mrnDisp(r.mrn,data.cfg.sys))}</span><span class="i">${esc(r.item)}</span><span class="dc">${esc(r.doc)}</span>`+
      `<button class="btn mini ghost" data-act="del" data-k="${esc(r.key)}">刪除</button></div>`; }).join('');
  const nT=data.recs.filter(r=>!r.void&&isT(r)).length;
  h+=`<details class="card sec" data-sec="recent"${ui.recent?' open':''}><summary><span>最近登錄</span><span class="r">今天 ${nT} 筆</span></summary>${rows||'<div class="mut">還沒有紀錄</div>'}</details>`;
  h+=installHtml('兒科自費登錄');
  el.innerHTML=h;
}
function renderAll(){ renderAlerts(); renderForm(); renderRest(); renderStatus(); }
window.onInstallReady=()=>renderRest();

// ---------- 送出 ----------
function doSend(){
  if(!canSend()) return;
  const today=isoDay(new Date()), doc=draft.other?String(draft.otherName||'').replace(/\s+/g,''):draft.doc;
  errs={};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(draft.date)||draft.date>today) errs.date=1;
  if(!draft.src) errs.src=1;
  if(!/^[0-9A-Z]{1,15}$/.test(draft.mrn)) errs.mrn=1;
  if(!draft.item) errs.item=1;
  if(!doc) errs.doc=1;
  if(Object.keys(errs).length){ renderForm(); const f=document.querySelector('.sec.err,.sl.err'); if(f) f.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  const src=draft.src==='其他'&&String(draft.srcX||'').trim()?'其他：'+String(draft.srcX).trim():draft.src;
  const r={id:Date.now().toString(36),kind:'add',date:draft.date,src,mrn:draft.mrn,item:draft.item,doc:normDoc(doc,data.cfg.docs)};
  const [y,m,d]=r.date.split('-').map(Number);
  const dup=data.recs.some(x=>!x.void&&x.y===y&&x.m===m&&x.d===d&&mrnCmp(x.mrn)===mrnCmp(r.mrn)&&x.item===r.item)||pending.some(p=>p.kind==='add'&&p.st!=='ok'&&p.date===r.date&&mrnCmp(p.mrn)===mrnCmp(r.mrn)&&p.item===r.item);
  const msg=(dup?`⚠ 這一天已經有一筆「${r.mrn}・${r.item}」，確定要再送一筆？\n\n`:'送出這一筆？\n\n')+
    `日期：${m}月${d}日\n來院：${r.src}\n病歷號：${r.mrn}\n項目：${r.item}\n開單醫師：${r.doc}`;
  if(!confirm(msg)) return;
  r.at=Date.now(); r.st='sending'; pending.unshift(r);
  draft=Object.assign(newDraft(),{src:draft.src,srcX:draft.srcX}); errs={}; renderForm(); renderRest();   // 來院留著（下一筆通常一樣）
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  window.scrollTo({top:0});
  sendOne(r).then(()=>{ renderRest(); if(r.st==='check') verifySoon(); });
}
function doDel(key,restore){
  const r=data&&data.recs.find(x=>x.key===key); if(!r||!sysReady(data.cfg.sys)) return;
  const txt=recTxt(r);
  if(!confirm(`刪除這一筆？\n\n${r.m}月${r.d}日・${r.src}・病歷號 ${mrnDisp(r.mrn,data.cfg.sys)}\n${r.item}\n開單醫師：${r.doc}`)) return;
  const p={id:Date.now().toString(36),kind:'void',key,restore:!!restore,txt,at:Date.now(),st:'sending'};
  pending.unshift(p); renderRest();
  sendOne(p).then(()=>{ renderRest(); if(p.st==='check') verifySoon(); });
}

// ---------- 操作 ----------
function act(a,t){
  if(a==='refresh') refresh(false);
  else if(a==='item'){ draft.item=t.dataset.v; delete errs.item; renderForm(); }
  else if(a==='date'){ draft.date=t.dataset.v; delete errs.date; renderForm(); }
  else if(a==='src'){ draft.src=t.dataset.v; delete errs.src; renderForm(); }
  else if(a==='doc'){ draft.doc=t.dataset.v; draft.other=false; delete errs.doc; renderForm(); }
  else if(a==='doc-other'){ draft.other=true; draft.doc=''; delete errs.doc; renderForm(); const o=$('f-other'); if(o) o.focus(); }
  else if(a==='send') doSend();
  else if(a==='del') doDel(t.dataset.k);
  else if(a==='recheck'){ pending.forEach(p=>{ if(p.st==='miss') p.st='check'; }); renderRest(); verifySoon(); }
  else if(a==='install'){ if(_installEvt){ const e=_installEvt; _installEvt=null; e.prompt(); renderRest(); } }
  else if(a==='open-browser') openInBrowser();
  else if(a==='link'){
    const id=sheetIdOf(($('link')||{}).value);
    if(!id){ alert('這看起來不是正確的連結，請把收到的整條連結完整貼上。'); return; }
    try{ localStorage.setItem(LS_SHEET,id); }catch(e){}
    location.hash='s='+id; location.reload();
  }
}
document.addEventListener('click',e=>{ const t=e.target.closest('[data-act]'); if(!t||t.tagName==='INPUT') return; act(t.dataset.act,t); });
document.addEventListener('input',e=>{ const t=e.target;
  if(t.id==='f-mrn'){ const v=t.value.replace(/[^0-9A-Za-z]/g,'').toUpperCase().slice(0,15); if(v!==t.value) t.value=v; draft.mrn=v; if(errs.mrn&&v){ delete errs.mrn; t.classList.remove('err'); } }
  else if(t.id==='f-other'){ draft.otherName=t.value; }
  else if(t.id==='f-srcx'){ draft.srcX=t.value; }
});
// 其他日期：選好就換成那一天（清掉＝回到今天）
document.addEventListener('change',e=>{ if(e.target.id==='f-date'){ const v=e.target.value, today=isoDay(new Date()); draft.date=v&&v<=today?v:today; delete errs.date; setTimeout(renderForm,0); } });
// 電腦上點日期格子也叫出日期選單
document.addEventListener('click',e=>{ if(e.target.id==='f-date'&&e.target.showPicker){ try{ e.target.showPicker(); }catch(_){} } });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='link') act('link',e.target); if(e.key==='Enter'&&e.target.id==='f-mrn') e.target.blur(); });
document.addEventListener('toggle',e=>{ const d=e.target; if(d.dataset&&d.dataset.sec) ui[d.dataset.sec]=d.open; },true);
window.addEventListener('hashchange',()=>{ const id=sheetIdOf(location.hash); if(id&&id!==SID) location.reload(); });
window.addEventListener('online',()=>{ renderAlerts(); flushOutbox(); refresh(true); });
window.addEventListener('offline',renderAlerts);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  checkVersion(()=>pending.some(p=>p.st==='sending'||p.st==='check'));
  // 換日了：日期跟著換成今天（還沒動過的話）
  if(!draft.mrn&&!draft.item&&draft.date<isoDay(new Date())){ draft.date=isoDay(new Date()); if(!typing()) renderForm(); }
  if(Date.now()-checked>15000) refresh(true);
});
setInterval(()=>{ if(document.visibilityState==='visible'&&!pending.some(p=>p.st==='check')) refresh(true); },60*1000);
setInterval(()=>{ if(document.visibilityState==='visible') checkVersion(()=>pending.some(p=>p.st==='sending'||p.st==='check')); },10*60*1000);

renderAll();
refresh(true);
</script>
